## Core

install: node scripts/install.mjs "$@"
#? install serially outside /vagrant (requires an external node_modules symlink)

serve: pnpm run dev
#? start Vite on 0.0.0.0:3000

build: pnpm run build
#? build the static site into dist

preview: pnpm run preview
#? preview dist on 0.0.0.0:3000

## Test

test: pnpm test
#? run core and editor-state tests

test-browser: pnpm run test:browser
#? run Chromium interaction checks against the existing dist build

check:
  op test || exit
  op build || exit
  op test-browser
#? run tests, build, and browser checks serially

## Dev

brand: node scripts/brand.cjs
#? regenerate branding assets and both Welcome logos from public/assets/logo.json

screenshots:
  op build || exit
  node scripts/screenshots.cjs
#? capture the Welcome project in light and dark themes for the README

## Production

deploy-hook: curl --fail-with-body --silent --show-error --request POST "${MOCKOUT_DEPLOY_HOOK:?Set MOCKOUT_DEPLOY_HOOK}"
#? trigger a Cloudflare build and deployment using MOCKOUT_DEPLOY_HOOK
