  <script>
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    let chosenTheme = null;
    try {
      const theme = localStorage.getItem('mockout-ui-theme');
      if (theme === 'light' || theme === 'dark') chosenTheme = theme;
    } catch { /* Use the system theme when storage is unavailable. */ }
    if (chosenTheme) document.documentElement.dataset.theme = chosenTheme;
    document.documentElement.dataset.uiTheme = chosenTheme || (systemTheme.matches ? 'dark' : 'light');
  </script>
