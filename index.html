<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onion UI — canvas</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="workspace" tabindex="-1" aria-label="Mock canvas">
    <div id="canvas" aria-label="Boxes"></div>
  </main>

  <div class="corner" aria-label="Canvas controls">
    <button type="button" tabindex="-1" data-tool="select">Select</button>
    <button type="button" tabindex="-1" data-tool="box">Box</button>
    <span class="divider"></span>
    <span class="small-label">Grid</span>
    <button type="button" tabindex="-1" data-grid="40">40</button>
    <button type="button" tabindex="-1" data-grid="20">20</button>
    <button type="button" tabindex="-1" data-grid="10">10</button>
    <button type="button" tabindex="-1" data-grid="5">5</button>
    <button type="button" tabindex="-1" data-grid="0">Off</button>
    <span class="divider"></span>
    <button type="button" tabindex="-1" id="open-button">Open</button>
    <button type="button" tabindex="-1" id="save-button">Save</button>
  </div>

  <aside id="inspector" hidden aria-label="Selected box properties">
    <header id="inspector-header" hidden>
      <button type="button" id="color-back">← Back</button>
      <strong id="inspector-title"></strong>
      <button type="button" id="delete-swatch" hidden>Delete</button>
    </header>
    <section id="box-properties">
    <label class="field">Text <input id="box-text" type="text" placeholder="Optional text"></label>
    <div class="two-fields">
      <label class="field">Width <input id="box-width" type="number" min="1" step="1"></label>
      <label class="field">Height <input id="box-height" type="number" min="1" step="1"></label>
    </div>
    <div class="two-fields">
      <label class="field">Radius <input id="box-radius" type="number" min="0" step="1"></label>
      <label class="field">Border <input id="box-border-width" type="number" min="0" step="1"></label>
    </div>
    <div class="two-fields">
      <label class="field">Padding X <input id="box-padding-x" type="number" min="0" step="1"></label>
      <label class="field">Padding Y <input id="box-padding-y" type="number" min="0" step="1"></label>
    </div>
    <div class="two-fields">
      <label class="field">Horizontal
        <select id="box-align-x"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
      </label>
      <label class="field">Vertical
        <select id="box-align-y"><option value="top">Top</option><option value="center">Center</option><option value="bottom">Bottom</option></select>
      </label>
    </div>
    <div class="color-fields">
      <div class="color-field"><span>Fill</span><button type="button" data-color-property="fill"></button></div>
      <div class="color-field"><span>Text</span><button type="button" data-color-property="textColor"></button></div>
      <div class="color-field"><span>Border</span><button type="button" data-color-property="borderColor"></button></div>
    </div>
    </section>
    <section id="swatch-chooser" hidden aria-label="Choose swatch">
      <div id="swatch-list"></div>
      <button type="button" id="new-swatch">New swatch</button>
    </section>
    <section id="swatch-editor" hidden aria-label="Swatch color picker">
      <label class="editor-field">Name <input id="swatch-name" type="text" maxlength="60" placeholder="Swatch name"></label>
      <label class="editor-field">Hex <input id="color-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="RRGGBB"></label>
      <div id="color-preview" aria-label="Color preview"></div>
      <div class="editor-field">Mode <select id="color-mode" aria-label="Color mode"><option value="hsb">HSB</option><option value="rgb">RGB</option><option value="gray">Grayscale</option></select></div>
      <div class="color-channel"><label for="channel-1" id="channel-1-label">H</label><input id="channel-1" type="range" min="0" max="360"><input id="channel-1-value" type="number" min="0" max="360" aria-label="Hue value"></div>
      <div class="color-channel"><label for="channel-2" id="channel-2-label">S</label><input id="channel-2" type="range" min="0" max="100"><input id="channel-2-value" type="number" min="0" max="100" aria-label="Saturation value"></div>
      <div class="color-channel"><label for="channel-3" id="channel-3-label">B</label><input id="channel-3" type="range" min="0" max="100"><input id="channel-3-value" type="number" min="0" max="100" aria-label="Brightness value"></div>
      <button type="button" id="save-swatch">Save</button>
      <p id="color-error" role="alert" hidden></p>
    </section>
  </aside>

  <input id="open-file" type="file" accept=".json,application/json" hidden>
  <p id="notice" role="alert" hidden></p>
  <p class="help">V select · B draw · Drag auto-moves contained elements · Alt+drag moves one box · Tab cycles boxes · Space+drag pans · Right-click properties</p>
</body>
</html>
